app:
  name: "Pi-Guard Lite"
  host: "0.0.0.0"
  port: 8080
  debug: true

auth:
  username: "admin"
  password: "admin"
  cookie_name: "pi_guard_auth"
  login_title: "Pi-Guard Lite"

paths:
  database: "data/pi_guard.db"
  logs_dir: "logs"
  raw_data_dir: "data/raw"
  backups_dir: "backups"
  templates_dir: "templates"

risk:
  alert_threshold: 40
  block_threshold: 85
  block_ttl_minutes: 30
  high_ttl_minutes: 15
  weights:
    severity_per_level: 10
    severity_cap: 30
    asset_importance: 5
    asset_cap: 25
    off_hours_bonus: 5
    blacklist_bonus: 20
    whitelist_penalty: 40
    baseline_cap: 25
    anomaly_multiplier: 0.15
    ml_anomaly_multiplier: 0.15
    ml_classifier_multiplier: 0.25

probe:
  enabled: true
  default_targets:
    - type: "http"
      target: "http://127.0.0.1:8080/health"
      timeout_seconds: 3
      required: true
  rollback_on_failed_required: true
  max_failed_required: 1

notifier:
  enabled: false
  channel: "webhook"
  webhook_url: ""
  timeout_seconds: 3

scan_listener:
  enabled: false
  bind_host: "0.0.0.0"
  report_host: "127.0.0.1"
  ports: "2201-2212"

retention:
  cleanup_enabled: true
  raw_days: 7
  log_days: 7
  backup_days: 30

ml:
  enabled: false
  anomaly_model_path: "models/anomaly_model.pkl"
  classifier_model_path: "models/classifier_model.pkl"
