executor:
  type: "ssh"
  device_name: "openwrt"
  dry_run: false
  host: "192.168.1.1"
  port: 22
  username: "root"
  password: ""
  key_path: "/root/.ssh/id_ed25519"
  block_command: "ipset add pi_guard_blacklist {ip} timeout {ttl}"
  unblock_command: "ipset del pi_guard_blacklist {ip}"
  limit_command: "tc qdisc add dev br-lan root tbf rate 1mbit burst 32kbit latency 400ms"
