[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info

[INPUT]
    Name          tail
    Path          /var/log/auth.log
    Tag           auth.log
    Read_from_Head true
    Path_Key      path

[INPUT]
    Name          tail
    Path          /var/log/syslog
    Tag           syslog
    Read_from_Head true
    Path_Key      path

[INPUT]
    Name          tail
    Path          /var/log/nginx/access.log
    Tag           nginx.access
    Read_from_Head true
    Path_Key      path

[INPUT]
    Name          tail
    Path          /var/log/nginx/error.log
    Tag           nginx.error
    Read_from_Head true
    Path_Key      path

[OUTPUT]
    Name          stdout
    Match         *
    Format        json_lines
