<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='device-console.css') }}">
</head>
<body>
  <div class="device-login-shell">
    <div class="device-login-topbar">{{ title }}</div>
    <div class="device-login-page">
      <div class="device-login-wrap">
        <div class="device-login-intro">
          <h1>智能防御控制台</h1>
          <p>用于统一查看威胁事件、联动策略、攻击分析、扫描监听、模型状态与运行状态。</p>
          <p>当前界面采用传统安全设备后台风格，适合做项目演示、联调与本地验证。</p>
          <div class="device-login-tip">
            默认演示账号：<strong>admin / admin</strong><br>
            建议后续在配置文件中修改默认口令。
          </div>
        </div>
        <div class="device-login-panel">
          <h2>用户登录</h2>
          {% if message %}
          <div class="message error">{{ message }}</div>
          {% endif %}
          <form method="post" action="/login">
            <label class="device-login-label">用户名</label>
            <input class="device-login-input" name="username" value="admin" autocomplete="username">
            <label class="device-login-label">密码</label>
            <input class="device-login-input" name="password" value="admin" type="password" autocomplete="current-password">
            <button class="device-login-button" type="submit">登录</button>
          </form>
          <div class="device-login-hint">
            说明：当前为本地演示环境。<br>
            登录失败次数过多时会临时锁定，成功或失败都会记入审计日志。
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
