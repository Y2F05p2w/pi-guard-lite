<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    body{
      margin:0;
      font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;
      background:#edf2f7;
      color:#1f2d3d;
    }
    .topbar{
      height:58px;
      background:linear-gradient(180deg,#0c67bc,#0a5aa6);
      border-bottom:1px solid #08457d;
      color:#fff;
      display:flex;
      align-items:center;
      padding:0 20px;
      font-size:16px;
      font-weight:600;
    }
    .page{
      min-height:calc(100vh - 58px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .login-wrap{
      width:920px;
      background:#fff;
      border:1px solid #cfd8e3;
      display:grid;
      grid-template-columns:1fr 360px;
    }
    .intro{
      padding:34px 36px;
      border-right:1px solid #e1e8f0;
      background:#f7fafd;
    }
    .intro h1{
      margin:0 0 14px;
      font-size:28px;
      color:#17324f;
      font-weight:600;
    }
    .intro p{
      margin:0 0 12px;
      line-height:1.8;
      color:#62788f;
      font-size:14px;
    }
    .intro .tip{
      margin-top:18px;
      padding:10px 12px;
      border:1px solid #d7e2ec;
      background:#fff;
      color:#3d5874;
      font-size:13px;
    }
    .panel{
      padding:34px 30px;
    }
    .panel h2{
      margin:0 0 18px;
      font-size:22px;
      font-weight:600;
      color:#17324f;
    }
    .msg{
      margin-bottom:14px;
      padding:10px 12px;
      border:1px solid #efc5bf;
      background:#fff1ef;
      color:#a33126;
      font-size:13px;
    }
    label{
      display:block;
      margin-bottom:6px;
      color:#5d7288;
      font-size:13px;
    }
    input{
      width:100%;
      height:36px;
      margin-bottom:14px;
      padding:0 10px;
      border:1px solid #bcc8d6;
      background:#fff;
      color:#1f2d3d;
      font:inherit;
    }
    button{
      width:100%;
      height:38px;
      border:1px solid #0a4f91;
      background:#0a63b6;
      color:#fff;
      font:inherit;
      cursor:pointer;
    }
    .hint{
      margin-top:12px;
      color:#6d8196;
      font-size:12px;
      line-height:1.7;
    }
    @media (max-width: 980px){
      .login-wrap{grid-template-columns:1fr;width:100%;max-width:420px}
      .intro{display:none}
    }
  </style>
</head>
<body>
  <div class="topbar">{{ title }}</div>
  <div class="page">
    <div class="login-wrap">
      <div class="intro">
        <h1>智能防御控制台</h1>
        <p>本系统用于统一查看威胁事件、联动策略、攻击分析、扫描监听、模型状态与运行状态。</p>
        <p>当前界面采用传统安全设备后台风格，适合做项目演示、联调与本地验证。</p>
        <div class="tip">
          默认演示账号：<strong>admin / admin</strong><br>
          建议后续在配置文件中修改默认口令。
        </div>
      </div>
      <div class="panel">
        <h2>用户登录</h2>
        {% if message %}
        <div class="msg">{{ message }}</div>
        {% endif %}
        <form method="post" action="/login">
          <label>用户名</label>
          <input name="username" value="admin" autocomplete="username">
          <label>密码</label>
          <input name="password" value="admin" type="password" autocomplete="current-password">
          <button type="submit">登录</button>
        </form>
        <div class="hint">
          说明：当前为本地演示环境。<br>
          登录后可进入事件中心、策略中心、高级分析、模型管理与运行状态页面。
        </div>
      </div>
    </div>
  </div>
</body>
</html>
