<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>手工操作</title>
  <style>
    body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fb}
    .nav a{margin-right:14px;color:#0b57d0;text-decoration:none}
    .card{background:#fff;padding:18px;border-radius:10px;max-width:520px;margin-top:16px}
    label{display:block;margin-top:10px}
    input{width:100%;padding:8px;margin-top:4px}
    button{margin-top:12px;padding:10px 16px}
  </style>
</head>
<body>
  <h1>手工操作</h1>
  <div class="nav"><a href="/">首页</a><a href="/events/view">事件</a><a href="/policies/view">策略</a><a href="/blocklist/view">黑名单</a></div>

  <div class="card">
    <h2>手工封禁</h2>
    <form method="post" action="/manual/block">
      <label>IP<input name="ip" value="203.0.113.50"></label>
      <label>TTL 秒数<input name="ttl_seconds" value="1800"></label>
      <label>原因<input name="reason" value="manual block"></label>
      <button type="submit">提交封禁</button>
    </form>
  </div>

  <div class="card">
    <h2>手工解封</h2>
    <form method="post" action="/manual/unblock">
      <label>IP<input name="ip" value="203.0.113.50"></label>
      <label>原因<input name="reason" value="manual unblock"></label>
      <button type="submit">提交解封</button>
    </form>
  </div>
</body>
</html>
