<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>探测结果</title>
<style>body{font-family:Arial,sans-serif;margin:24px;background:#f5f7fb}.nav a{margin-right:14px;color:#0b57d0;text-decoration:none}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}</style>
</head>
<body>
  <h1>探测结果</h1>
  <div class="nav"><a href="/">首页</a><a href="/events/view">事件</a><a href="/policies/view">策略</a><a href="/blocklist/view">黑名单</a></div>
  <table>
    <thead><tr><th>ID</th><th>策略ID</th><th>目标</th><th>结果</th><th>延迟(ms)</th><th>时间</th></tr></thead>
    <tbody>
      {% for item in items %}
      <tr><td>{{ item.id }}</td><td>{{ item.policy_id or "-" }}</td><td>{{ item.probe_target }}</td><td>{{ item.result }}</td><td>{{ item.latency_ms or "-" }}</td><td>{{ item.created_at }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
